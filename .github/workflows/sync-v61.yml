name: Sync verified v61

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-v61
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify the packaged release
        env:
          ARCHIVE_URL: https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v61.zip
          EXPECTED_SHA256: 15d489d3394d7e3c5c4c746d6378f93676d3ae89a88b51c7b5bd9e33836d4672
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 "$ARCHIVE_URL" -o /tmp/merge-v61.zip
          echo "$EXPECTED_SHA256  /tmp/merge-v61.zip" | sha256sum -c -
          rm -rf /tmp/merge-v61
          mkdir -p /tmp/merge-v61
          unzip -q /tmp/merge-v61.zip -d /tmp/merge-v61
          test -f /tmp/merge-v61/index.html
          test -f /tmp/merge-v61/styles.css
          grep -q 'aria-label="Merge version 61"' /tmp/merge-v61/index.html
          grep -q "Keep the board's context" /tmp/merge-v61/styles.css
          grep -q "merge-2048-v61" /tmp/merge-v61/sw.js

      - name: Replace the browser files
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for entry in *; do
            case "$entry" in
              .git|. github) continue ;;
            esac
            rm -rf -- "$entry"
          done
          cp -a /tmp/merge-v61/. .
          test -f index.html
          test -f .nojekyll
          git status --short

      - name: Commit and publish
        run: |
          set -euo pipefail
          git config user.name 'Moh23rd'
          git config user.email '304935448+Moh23rd@users.noreply.github.com'
          if [ -z "$(git status --porcelain)" ]; then
            echo 'The published files already match v61.'
            exit 0
          fi
          git add -A
          git commit -m 'Fix fullscreen header and publish v61'
          git push origin HEAD:main
