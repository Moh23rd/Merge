name: Publish Merge v62

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace site files with the v62 release
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 \
            "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v62.zip" \
            -o /tmp/merge-2048-v62.zip
          unzip -oq /tmp/merge-2048-v62.zip -d .
          grep -q 'Version 62' index.html
          grep -q "merge-2048-v62" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site is already v62."
            exit 0
          fi
          git commit -m "$(printf 'release: Merge v62\n\nSmoothed fullscreen layout, anchored controls, improved contrast and a refined offline cache.\n\n🤖 Generated with Codebuff\nCo-Authored-By: Codebuff <noreply@codebuff.com>')"
          git push origin HEAD:main
