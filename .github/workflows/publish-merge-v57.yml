name: Publish Merge v57

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the production package
        run: |
          set -euo pipefail
          curl -fsSL "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v57.zip" -o /tmp/merge-v57.zip
          echo "169ca6c8a6f081113aacc63178ae864096e54b768668ef409c44ebe7248a597a  /tmp/merge-v57.zip" | sha256sum -c -
          unzip -oq /tmp/merge-v57.zip -d .
      - name: Commit the refreshed app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "Enlarge board on large monitors"
          git push
