name: Publish Merge v58

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the production package
        run: |
          set -euo pipefail
          curl -fsSL "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v58.zip" -o /tmp/merge-v58.zip
          echo "a5ecef54c29e8610d629045d392c549ad44cc7e858f8a4809c7520229c38fff2  /tmp/merge-v58.zip" | sha256sum -c -
          unzip -oq /tmp/merge-v58.zip -d .
      - name: Commit the refreshed app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "Scale the board for large displays"
          git push
