name: Fix Sixfold share title

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-share-title.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update share title
        run: |
          set -euo pipefail
          sed -i 's/Merge — 2048/Sixfold — Merge/g' game.js
          grep -q "title: 'Sixfold — Merge'" game.js
          rm -f .github/workflows/fix-share-title.yml
          git config user.name "Moh23rd"
          git config user.email "304935448+Moh23rd@users.noreply.github.com"
          git add -A
          git commit -m "Use Sixfold name in share sheet"
          git push origin HEAD:main
