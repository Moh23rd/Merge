name: Publish Merge v56

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the production package
        run: |
          set -euo pipefail
          curl -fsSL "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v56.zip" -o /tmp/merge-v56.zip
          echo "c2ae5a7fd62f4aea597f723e35b0a7839876b0161675ea54fec387cf21ae2848  /tmp/merge-v56.zip" | sha256sum -c -
          unzip -oq /tmp/merge-v56.zip -d .
      - name: Commit the refreshed app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "Refine Merge desktop layout"
          git push
