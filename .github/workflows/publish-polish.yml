name: Publish Sixfold 2.0.1
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply prepared polish patch
        run: |
          set -euo pipefail
          test -f polish.patch.b64
          base64 -d polish.patch.b64 | gunzip > /tmp/sixfold-polish.patch
          git apply --check /tmp/sixfold-polish.patch
          git apply /tmp/sixfold-polish.patch
          rm -f polish.patch.b64 .github/workflows/publish-polish.yml
          git config user.name "Moh23rd"
          git config user.email "mohrd9685@gmail.com"
          git add -A
          git commit -m "Ship Sixfold 2.0.1 polish pass" -m "Refreshes share cards across all games, varies One Line levels, refines Fruit Merge art and difficulty, and adds a small victory animation." -m "🤖 Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push origin HEAD:main
