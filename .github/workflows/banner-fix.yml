name: Update README banner

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-banner:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch corrected banner and update links
        run: |
          curl -fsSL "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/og-image.png?v=1.0.5" -o og-image.png
          test "$(wc -c < og-image.png)" -gt 90000
          test "$(md5sum og-image.png | awk '{print $1}')" = "a666487447d32ccb8ee05bf1bc0426a3"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          s = s.replace('![Merge — 2048](og-image.png)', '![Merge — 2048](og-image.png?v=1.0.5)')
          p.write_text(s)
          p = Path('index.html')
          s = p.read_text().replace('og-image.png?v=1.0.4', 'og-image.png?v=1.0.5')
          p.write_text(s)
          PY

      - name: Commit and push
        run: |
          git config user.name "Merge"
          git config user.email "mohrd9685@gmail.com"
          git add og-image.png README.md index.html
          if git diff --cached --quiet; then
            echo "No banner changes to commit."
            exit 0
          fi
          git commit -m "Fix README banner tile alignment"
          git push