name: Publish Merge v55

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the production package
        run: |
          set -euo pipefail
          curl -fsSL "https://site-58d4c06196df4e3aa353fcca2f921cf1.freebuff.page/download/merge-2048-v55.zip" -o /tmp/merge-v55.zip
          echo "eb04e71fdf5979f7730be23e7af3240193ba351127e4c1cab824b973f94fd0f8  /tmp/merge-v55.zip" | sha256sum -c -
          unzip -q /tmp/merge-v55.zip -d .
      - name: Commit the refreshed app
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git commit -m "Refresh Merge for desktop"
          git push
