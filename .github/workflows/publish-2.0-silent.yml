name: Keep Sixfold on 2.0
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply silent 2.0 rollback
        shell: bash
        run: |
          set -euo pipefail
          base64 -d sixfold-2.0-silent.patch.gz.b64 | gunzip > /tmp/sixfold-2.0-silent.patch
          echo "1bce24efa0f861179415a01d7564d106528b48dd5b55cecfb01fe42f6d68b47f  /tmp/sixfold-2.0-silent.patch" | sha256sum -c -
          git apply --check /tmp/sixfold-2.0-silent.patch
          git apply /tmp/sixfold-2.0-silent.patch
          rm -f sixfold-2.0-silent.patch.gz.b64 .github/workflows/publish-2.0-silent.yml
          git config user.name "Moh23rd"
          git config user.email "mohrd9685@gmail.com"
          git add -A
          git commit -m "Keep the silent polish on Sixfold 2.0" -m "Remove the separate 2.1 About entry and What’s New notice, keep the public version label and README on 2.0, and align the offline cache with 2.0.0." -m "🤖 Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push origin HEAD:main
