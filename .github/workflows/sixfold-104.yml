name: Sixfold 1.0.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the 1.0.4 release
        run: |
          set -euo pipefail
          cat sixfold-104.patch.gz.part.* > /tmp/sixfold.patch.gz
          gunzip -c /tmp/sixfold.patch.gz > /tmp/sixfold.patch
          echo "90de316c27698e47ca4658598a5647ce6a98008bef13cd1785738c6aa3f52434  /tmp/sixfold.patch" | sha256sum -c -
          git apply --check /tmp/sixfold.patch
          git apply /tmp/sixfold.patch
          git config user.name "Sixfold Release"
          git config user.email "actions@users.noreply.github.com"
          git rm -q sixfold-104.patch.gz.part.* .github/workflows/sixfold-104.yml
          git add -A
          git commit -m "Ship Sixfold 1.0.4 and the 100-shape One Line"
          git push origin HEAD:main
