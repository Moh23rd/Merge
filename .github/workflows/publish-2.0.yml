name: Publish Sixfold 2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-2.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sixfold-2-0-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import verified 2.0 build
        env:
          BASE: https://site-3567f367a42644389571dc746002fbdc.freebuff.page
        run: |
          set -euo pipefail

          # Remove the old single-game app; 2.0 replaces every path.
          rm -rf OFL.txt fonts game.js games.css games.js haptics.js icons \
            index.html install.js og-image.png splash styles.css sw.js theme.js

          count=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            if [ "$path" = "index.html" ]; then
              curl -fsSL --retry 4 --retry-delay 3 "$BASE/" -o "$path"
            else
              curl -fsSL --retry 4 --retry-delay 3 "$BASE/$path" -o "$path"
            fi
            count=$((count + 1))
          done < .github/app-files.txt
          echo "Imported $count app files."

          # This importer is one-time only.
          rm -f .github/workflows/publish-2.0.yml .github/app-files.txt

          git config user.name "Moh23rd"
          git config user.email "304935448+Moh23rd@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Publish Sixfold 2.0"
          git push origin HEAD:main
