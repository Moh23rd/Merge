name: Trim Sixfold About changelog
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply About changelog trim
        shell: bash
        run: |
          set -euo pipefail
          base64 -d sixfold-about.patch.gz.b64 | gunzip > /tmp/sixfold-about.patch
          echo "2374729613a82c83a7c007afdaf8a45a8ca9210f4584f4f76595d68e6baf94b6  /tmp/sixfold-about.patch" | sha256sum -c -
          git apply --check /tmp/sixfold-about.patch
          git apply /tmp/sixfold-about.patch
          rm -f sixfold-about.patch.gz.b64 .github/workflows/publish-about-changelog.yml
          git config user.name "Moh23rd"
          git config user.email "mohrd9685@gmail.com"
          git add -A
          git commit -m "Trim the About changelog to major releases" -m "Keep 2.1, 2.0 and 1.0 in the public About panel; remove the 1.0.5, 1.0.4 and 1.0.3 patch entries." -m "🤖 Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push origin HEAD:main
