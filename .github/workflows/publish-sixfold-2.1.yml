name: Publish Sixfold 2.1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-sixfold-2-1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify staged patch parts
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected path; do
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Expected blob $expected, got $actual"
              exit 1
            fi
          done <<'EOF'
          9dfa95cde7573665e95589188c6d117642e359cb  sixfold-2.1.patch.xz.b64.part-00
          24f427c45b122693708d2c8342a442d9aa263ac7  sixfold-2.1.patch.xz.b64.part-01
          f3695c73863984f2fcbe6cfdfceec57e98058867  sixfold-2.1.patch.xz.b64.part-02
          f667ccc84c7f0a0210e770e2aa6913a6e9268bf0  sixfold-2.1.patch.xz.b64.part-03
          eebb96c309fa3cac4b1e99b6aedec28159d1a017  sixfold-2.1.patch.xz.b64.part-04
          6e4be1e342b2415b926f999814c647cf36552905  sixfold-2.1.patch.xz.b64.part-05
          d6f710d4dc2bf9adbef4bb5b46675b2bebd1fb17  sixfold-2.1.patch.xz.b64.part-06
          2df90114b9db2c78c5aa41b35224ebe9b6b5a816  sixfold-2.1.patch.xz.b64.part-07
          EOF
      - name: Apply Sixfold 2.1
        shell: bash
        run: |
          set -euo pipefail
          cat sixfold-2.1.patch.xz.b64.part-* | base64 -d | xz -d > /tmp/sixfold-2.1.patch
          echo "acb6fa62a592846f848b97098a3c9653a95138a0d2f07645eb614bb40060c463  /tmp/sixfold-2.1.patch" | sha256sum -c -
          git apply --check /tmp/sixfold-2.1.patch
          git apply /tmp/sixfold-2.1.patch
          rm -f sixfold-2.1.patch.xz.b64.part-* .github/workflows/publish-sixfold-2.1.yml
          git config user.name "Moh23rd"
          git config user.email "mohrd9685@gmail.com"
          git add -A
          git commit -m "Ship Sixfold 2.1 motion, natural fruit and hidden Wordle" -m "Publishes the tested 2.1 build: PC motion, Fruit Merge natural colours, desktop header spacing and the hidden Wordle." -m "🤖 Generated with Codebuff" -m "Co-Authored-By: Codebuff <noreply@codebuff.com>"
          git push origin HEAD:main
