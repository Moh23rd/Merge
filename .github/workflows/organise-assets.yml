name: Organise public assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the work branch
        uses: actions/checkout@v4
        with:
          ref: chore/organise-assets

      - name: Move styles and scripts into folders
        run: python3 .github/organise_public.py

      - name: Check the 4.0 release
        run: node scripts/check-4.0.mjs

      - name: Commit the organised tree
        run: |
          git config user.name "MOH23RD"
          git config user.email "304935448+Moh23rd@users.noreply.github.com"
          git add -A
          git commit -m "Organise the public styles and scripts"
          git push origin HEAD:chore/organise-assets
