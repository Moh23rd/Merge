name: Apply Sixfold CSS cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sixfold-css-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sixfold-css-cleanup
  cancel-in-progress: false

