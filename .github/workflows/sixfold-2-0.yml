name: Publish Sixfold 2.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch the tested 2.0 build
        env:
          PREVIEW: https://site-3567f367a42644389571dc746002fbdc.freebuff.page
        run: |
          set -euo pipefail
          for file in \
            index.html \
            home.css \
            games.css \
            games.js \
            sw.js \
            og-image.png
          do
            curl --fail --silent --show-error --location "$PREVIEW/$file" --output "$file"
          done

          test "$(head -c 15 index.html)" = "<!doctype html>"
          grep -q 'Six games. No filler.' index.html
          grep -q "home.css?v=2.0.0" index.html
          grep -q "const VERSION = 'sixfold-2.0.0';" sw.js
          node --check games.js
          node --check sw.js

          python3 - <<'PY'
          import json
          for name in ('manifest.webmanifest', 'manifest-dark.webmanifest'):
              with open(name, encoding='utf-8') as handle:
                  json.load(handle)
          print('Release files validated')
          PY

      - name: Commit the release
        run: |
          set -euo pipefail
          git config user.name "Moh23rd"
          git config user.email "mohrd9685@gmail.com"
          git add index.html home.css games.css games.js sw.js og-image.png
          git commit -m "Ship Sixfold 2.0 with the new pocket-arcade home"
          git push origin HEAD:main
