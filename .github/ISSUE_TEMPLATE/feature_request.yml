name: Idea or feedback
description: Suggest a game, a quality-of-life change or a new daily idea.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
  - type: checkboxes
    id: fit
    attributes:
      label: Sixfold fit
      options:
        - label: This can work offline and without an account.
        - label: This does not require ads or tracking.
